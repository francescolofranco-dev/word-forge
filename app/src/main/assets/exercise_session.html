<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>WordForge exercise session</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #fff9f2;
            --surface: #ffffff;
            --surface-muted: #f6eee5;
            --text: #251a12;
            --text-muted: #6e6258;
            --primary: #8b3f19;
            --primary-hover: #713112;
            --on-primary: #ffffff;
            --border: #dfd2c5;
            --focus: #006b5e;
            --correct: #146c43;
            --correct-background: #e4f5ea;
            --incorrect: #a32626;
            --incorrect-background: #fde9e7;
            --shadow: 0 4px 18px rgba(67, 43, 24, 0.09);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #19120e;
                --surface: #251c17;
                --surface-muted: #332720;
                --text: #f6e9dc;
                --text-muted: #c9b9aa;
                --primary: #ffb68d;
                --primary-hover: #ffc8aa;
                --on-primary: #4f1c05;
                --border: #56463b;
                --focus: #77d7c9;
                --correct: #78dba3;
                --correct-background: #153d2a;
                --incorrect: #ffb4ab;
                --incorrect-background: #541f1e;
                --shadow: none;
            }
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--background);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--background);
            color: var(--text);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button,
        input,
        textarea,
        select,
        .choice-label {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        .choice-label:has(input:focus-visible) {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .page {
            width: min(100%, 780px);
            margin: 0 auto;
            padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
        }

        .session-header {
            padding: 4px 4px 22px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        h1,
        h2,
        h3,
        p {
            overflow-wrap: anywhere;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.75rem, 6vw, 2.45rem);
            line-height: 1.12;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        progress {
            width: 100%;
            height: 10px;
            overflow: hidden;
            border: 0;
            border-radius: 999px;
            background: var(--surface-muted);
            accent-color: var(--primary);
        }

        progress::-webkit-progress-bar {
            border-radius: 999px;
            background: var(--surface-muted);
        }

        progress::-webkit-progress-value {
            border-radius: 999px;
            background: var(--primary);
            transition: width 180ms ease-out;
        }

        .progress-text {
            min-width: max-content;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 650;
        }

        .exercise-list {
            display: grid;
            gap: 18px;
        }

        .exercise-card,
        .completion-card,
        .empty-card {
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .exercise-card {
            padding: clamp(18px, 5vw, 26px);
        }

        .exercise-card.is-correct {
            border-color: var(--correct);
        }

        .exercise-number {
            margin: 0 0 8px;
            color: var(--primary);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.075em;
            text-transform: uppercase;
        }

        .exercise-card h2 {
            margin: 0;
            font-size: clamp(1.25rem, 4.5vw, 1.55rem);
            line-height: 1.25;
        }

        .instructions {
            margin: 10px 0 0;
            color: var(--text-muted);
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .prompt {
            margin: 18px 0 0;
            padding: 16px;
            border-radius: 16px;
            background: var(--surface-muted);
            font-size: 1.08rem;
            font-weight: 650;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        fieldset {
            min-width: 0;
            margin: 18px 0 0;
            padding: 0;
            border: 0;
        }

        legend,
        .input-label {
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 650;
        }

        .choice-list {
            display: grid;
            gap: 10px;
        }

        .choice-label {
            display: flex;
            min-height: 48px;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
        }

        .choice-label:hover {
            border-color: var(--primary);
            background: var(--surface-muted);
        }

        .choice-label:has(input:checked) {
            border-color: var(--primary);
            background: var(--surface-muted);
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
            margin: 0;
            accent-color: var(--primary);
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            min-height: 50px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface);
            color: var(--text);
        }

        textarea {
            min-height: 96px;
            resize: vertical;
            line-height: 1.45;
        }

        .answer-block {
            margin-top: 18px;
        }

        .matching-list {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }

        .matching-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 12px;
        }

        .matching-left {
            font-weight: 650;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            min-height: 48px;
            padding: 11px 20px;
            border-radius: 999px;
            font-weight: 750;
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
            opacity: 0.52;
        }

        .check-button {
            border: 1px solid var(--primary);
            background: var(--primary);
            color: var(--on-primary);
        }

        .check-button:not(:disabled):hover {
            background: var(--primary-hover);
        }

        .reset-button,
        .review-button {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }

        .feedback {
            min-height: 0;
            margin-top: 16px;
            padding: 0;
            border-radius: 14px;
            font-weight: 700;
            line-height: 1.45;
        }

        .feedback:not(:empty) {
            padding: 12px 14px;
        }

        .feedback.correct {
            background: var(--correct-background);
            color: var(--correct);
        }

        .feedback.incorrect,
        .feedback.error {
            background: var(--incorrect-background);
            color: var(--incorrect);
        }

        .explanation {
            margin-top: 12px;
            padding-left: 14px;
            border-left: 3px solid var(--primary);
            color: var(--text-muted);
            line-height: 1.5;
        }

        .explanation strong,
        .explanation p {
            display: block;
            margin: 0;
        }

        .explanation p {
            margin-top: 4px;
            white-space: pre-wrap;
        }

        .completion-card,
        .empty-card {
            margin-top: 18px;
            padding: 28px 22px;
            text-align: center;
        }

        .completion-mark {
            display: grid;
            width: 64px;
            height: 64px;
            place-items: center;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--correct-background);
            color: var(--correct);
            font-size: 2rem;
            font-weight: 800;
        }

        .completion-card h2,
        .empty-card h2 {
            margin: 0;
            font-size: 1.55rem;
        }

        .completion-card p,
        .empty-card p {
            margin: 8px 0 0;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .review-button {
            margin-top: 18px;
        }

        [hidden] {
            display: none !important;
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        @media (max-width: 520px) {
            .matching-row {
                grid-template-columns: 1fr;
                gap: 7px;
            }

            .actions button {
                flex: 1 1 120px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="session-header">
        <p class="eyebrow">Practice session</p>
        <h1 id="session-title">Your exercises</h1>
        <div id="progress-row" class="progress-row" hidden>
            <progress id="session-progress" value="0" max="1" aria-label="Session progress"></progress>
            <span id="progress-text" class="progress-text">0 of 0</span>
        </div>
        <p id="progress-announcement" class="visually-hidden" aria-live="polite"></p>
    </header>

    <div id="exercise-list" class="exercise-list"></div>

    <section id="completion" class="completion-card" tabindex="-1" hidden>
        <div class="completion-mark" aria-hidden="true">✓</div>
        <h2>Session complete</h2>
        <p id="completion-summary">You completed every exercise.</p>
        <button id="review-button" class="review-button" type="button">Review exercises</button>
    </section>

    <section id="empty-state" class="empty-card" hidden>
        <h2 id="empty-title">No exercises yet</h2>
        <p id="empty-message">Generate a new session and try again.</p>
    </section>
</main>

<script>
    (function () {
        "use strict";

        var sessionTitle = document.getElementById("session-title");
        var progressRow = document.getElementById("progress-row");
        var progressBar = document.getElementById("session-progress");
        var progressText = document.getElementById("progress-text");
        var progressAnnouncement = document.getElementById("progress-announcement");
        var exerciseList = document.getElementById("exercise-list");
        var completion = document.getElementById("completion");
        var completionSummary = document.getElementById("completion-summary");
        var reviewButton = document.getElementById("review-button");
        var emptyState = document.getElementById("empty-state");
        var emptyTitle = document.getElementById("empty-title");
        var emptyMessage = document.getElementById("empty-message");

        var completedExercises = [];
        var renderedControllers = [];

        function persistSessionState() {
            var bridge = window.WordForgeSessionState;
            if (!bridge || typeof bridge.saveState !== "function" || renderedControllers.length === 0) {
                return;
            }
            var state = {
                version: 1,
                answers: renderedControllers.map(function (controller) {
                    return controller.getState();
                }),
                completed: completedExercises.map(function (completed) {
                    return completed === true;
                })
            };
            try {
                bridge.saveState(JSON.stringify(state));
            } catch (error) {
                // State restoration is best-effort and never blocks the exercise UI.
            }
        }

        function clearElement(element) {
            while (element.firstChild) {
                element.removeChild(element.firstChild);
            }
        }

        function text(value) {
            if (value === null || value === undefined) {
                return "";
            }
            return String(value);
        }

        function array(value) {
            return Array.isArray(value) ? value : [];
        }

        function element(tagName, className, content) {
            var node = document.createElement(tagName);
            if (className) {
                node.className = className;
            }
            if (content !== undefined && content !== null) {
                node.textContent = text(content);
            }
            return node;
        }

        function normalizeAnswer(value) {
            var normalized = text(value).trim().replace(/\s+/g, " ");
            if (typeof normalized.normalize === "function") {
                normalized = normalized.normalize("NFC");
            }
            return normalized.toLocaleLowerCase();
        }

        function decodeBase64Utf8(encoded) {
            var binary = window.atob(encoded);
            var bytes = new Uint8Array(binary.length);
            for (var index = 0; index < binary.length; index += 1) {
                bytes[index] = binary.charCodeAt(index);
            }
            if (typeof TextDecoder !== "undefined") {
                return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
            }
            var escaped = "";
            for (var byteIndex = 0; byteIndex < bytes.length; byteIndex += 1) {
                escaped += "%" + ("0" + bytes[byteIndex].toString(16)).slice(-2);
            }
            return decodeURIComponent(escaped);
        }

        function typeLabel(type) {
            switch (type) {
                case "MULTIPLE_CHOICE":
                    return "Multiple choice";
                case "FILL_IN_BLANK":
                    return "Fill in the blank";
                case "TRANSLATION":
                    return "Translation";
                case "MATCHING":
                    return "Matching";
                default:
                    return "Exercise";
            }
        }

        function acceptedAnswers(exercise) {
            var answers = array(exercise.accepted_answers);
            if (answers.length === 0) {
                answers = array(exercise.acceptable_answers);
            }
            if (answers.length === 0 && Array.isArray(exercise.correct_answer)) {
                answers = exercise.correct_answer;
            }
            if (answers.length === 0 && exercise.correct_answer !== undefined) {
                answers = [exercise.correct_answer];
            }
            return answers.map(normalizeAnswer).filter(function (answer) {
                return answer.length > 0;
            });
        }

        function multipleChoiceIndex(exercise, options) {
            var candidate = exercise.correct_option_index;
            if (Number.isInteger(candidate) && candidate >= 0 && candidate < options.length) {
                return candidate;
            }
            if (Number.isInteger(exercise.correct_answer) &&
                exercise.correct_answer >= 0 &&
                exercise.correct_answer < options.length) {
                return exercise.correct_answer;
            }
            if (typeof exercise.correct_answer === "string") {
                var expected = normalizeAnswer(exercise.correct_answer);
                return options.findIndex(function (option) {
                    return normalizeAnswer(option) === expected;
                });
            }
            return -1;
        }

        function shuffledIndices(length) {
            var indices = [];
            for (var index = 0; index < length; index += 1) {
                indices.push(index);
            }
            for (var cursor = indices.length - 1; cursor > 0; cursor -= 1) {
                var swapWith = Math.floor(Math.random() * (cursor + 1));
                var value = indices[cursor];
                indices[cursor] = indices[swapWith];
                indices[swapWith] = value;
            }
            return indices;
        }

        function multipleChoiceController(exercise, exerciseIndex) {
            var options = array(exercise.options);
            var fieldset = element("fieldset");
            fieldset.appendChild(element("legend", null, "Choose one answer"));
            var choiceList = element("div", "choice-list");
            var inputs = [];

            options.forEach(function (option, optionIndex) {
                var label = element("label", "choice-label");
                var input = document.createElement("input");
                input.type = "radio";
                input.name = "exercise-" + exerciseIndex;
                input.value = String(optionIndex);
                label.appendChild(input);
                label.appendChild(element("span", null, option));
                choiceList.appendChild(label);
                inputs.push(input);
            });
            fieldset.appendChild(choiceList);

            var correctIndex = multipleChoiceIndex(exercise, options);
            return {
                node: fieldset,
                focusTarget: function () {
                    return inputs[0] || null;
                },
                hasAnswer: function () {
                    return inputs.some(function (input) { return input.checked; });
                },
                isCorrect: function () {
                    return correctIndex >= 0 && inputs.some(function (input, index) {
                        return input.checked && index === correctIndex;
                    });
                },
                getState: function () {
                    return inputs.findIndex(function (input) { return input.checked; });
                },
                restoreState: function (value) {
                    inputs.forEach(function (input, index) {
                        input.checked = Number.isInteger(value) && value === index;
                    });
                },
                reset: function () {
                    inputs.forEach(function (input) {
                        input.checked = false;
                        input.disabled = false;
                    });
                },
                lock: function () {
                    inputs.forEach(function (input) { input.disabled = true; });
                },
                onChange: function (listener) {
                    inputs.forEach(function (input) {
                        input.addEventListener("change", listener);
                    });
                }
            };
        }

        function writtenAnswerController(exercise, exerciseIndex, multiline) {
            var wrapper = element("div", "answer-block");
            var inputId = "written-answer-" + exerciseIndex;
            var label = element("label", "input-label", "Your answer");
            label.htmlFor = inputId;
            var input = document.createElement(multiline ? "textarea" : "input");
            input.id = inputId;
            if (!multiline) {
                input.type = "text";
            }
            input.maxLength = 500;
            input.autocomplete = "off";
            input.autocapitalize = "sentences";
            input.spellcheck = true;
            wrapper.appendChild(label);
            wrapper.appendChild(input);

            var answers = acceptedAnswers(exercise);
            return {
                node: wrapper,
                focusTarget: function () { return input; },
                hasAnswer: function () { return input.value.trim().length > 0; },
                isCorrect: function () {
                    var submitted = normalizeAnswer(input.value);
                    return submitted.length > 0 && answers.indexOf(submitted) >= 0;
                },
                getState: function () { return input.value; },
                restoreState: function (value) {
                    input.value = typeof value === "string" ? value.slice(0, 500) : "";
                },
                reset: function () {
                    input.value = "";
                    input.disabled = false;
                },
                lock: function () { input.disabled = true; },
                onChange: function (listener) {
                    input.addEventListener("input", listener);
                },
                onSubmit: function (listener) {
                    input.addEventListener("keydown", function (event) {
                        if (!multiline && event.key === "Enter") {
                            event.preventDefault();
                            listener();
                        }
                    });
                }
            };
        }

        function matchingController(exercise, exerciseIndex) {
            var pairs = array(exercise.pairs).filter(function (pair) {
                return pair && typeof pair === "object";
            });
            var wrapper = element("div", "matching-list");
            var optionOrder = shuffledIndices(pairs.length);
            var selects = [];

            pairs.forEach(function (pair, pairIndex) {
                var row = element("div", "matching-row");
                var selectId = "match-" + exerciseIndex + "-" + pairIndex;
                var label = element("label", "matching-left", pair.left);
                label.htmlFor = selectId;
                var select = document.createElement("select");
                select.id = selectId;

                var placeholder = element("option", null, "Choose a match");
                placeholder.value = "";
                select.appendChild(placeholder);
                optionOrder.forEach(function (optionIndex) {
                    var option = element("option", null, pairs[optionIndex].right);
                    option.value = String(optionIndex);
                    select.appendChild(option);
                });

                row.appendChild(label);
                row.appendChild(select);
                wrapper.appendChild(row);
                selects.push(select);
            });

            return {
                node: wrapper,
                focusTarget: function () { return selects[0] || null; },
                hasAnswer: function () {
                    return selects.length > 0 && selects.every(function (select) {
                        return select.value !== "";
                    });
                },
                isCorrect: function () {
                    return selects.length > 0 && selects.every(function (select, index) {
                        return select.value === String(index);
                    });
                },
                getState: function () {
                    return selects.map(function (select) { return select.value; });
                },
                restoreState: function (values) {
                    var restored = Array.isArray(values) ? values : [];
                    selects.forEach(function (select, index) {
                        var candidate = restored[index];
                        select.value = typeof candidate === "string" ? candidate : "";
                    });
                },
                reset: function () {
                    selects.forEach(function (select) {
                        select.value = "";
                        select.disabled = false;
                    });
                },
                lock: function () {
                    selects.forEach(function (select) { select.disabled = true; });
                },
                onChange: function (listener) {
                    selects.forEach(function (select) {
                        select.addEventListener("change", listener);
                    });
                }
            };
        }

        function unsupportedController(type) {
            var node = element("div", "feedback error");
            var typeText = text(type);
            node.textContent = typeText.length > 0
                ? "This exercise type is not supported: " + typeText
                : "This exercise type is not supported.";
            return {
                node: node,
                supported: false,
                focusTarget: function () { return null; },
                hasAnswer: function () { return false; },
                isCorrect: function () { return false; },
                getState: function () { return null; },
                restoreState: function () {},
                reset: function () {},
                lock: function () {},
                onChange: function () {}
            };
        }

        function answerController(exercise, exerciseIndex) {
            switch (text(exercise.type).toUpperCase()) {
                case "MULTIPLE_CHOICE":
                    return multipleChoiceController(exercise, exerciseIndex);
                case "FILL_IN_BLANK":
                    return writtenAnswerController(exercise, exerciseIndex, false);
                case "TRANSLATION":
                    return writtenAnswerController(exercise, exerciseIndex, true);
                case "MATCHING":
                    return matchingController(exercise, exerciseIndex);
                default:
                    return unsupportedController(exercise.type);
            }
        }

        function updateProgress(shouldFocusCompletion) {
            var total = renderedControllers.length;
            var completed = completedExercises.filter(Boolean).length;
            progressBar.max = Math.max(total, 1);
            progressBar.value = completed;
            progressText.textContent = completed + " of " + total;
            progressAnnouncement.textContent = completed + " of " + total + " exercises complete.";
            completionSummary.textContent = total === 1
                ? "You completed the exercise."
                : "You completed all " + total + " exercises.";

            var allComplete = total > 0 && completed === total;
            completion.hidden = !allComplete;
            if (allComplete && shouldFocusCompletion !== false) {
                completion.focus({ preventScroll: true });
                completion.scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        function renderExercise(exercise, exerciseIndex, total) {
            var card = element("section", "exercise-card");
            var headingId = "exercise-heading-" + exerciseIndex;
            card.setAttribute("aria-labelledby", headingId);
            card.appendChild(element(
                "p",
                "exercise-number",
                "Exercise " + (exerciseIndex + 1) + " of " + total + " · " + typeLabel(text(exercise.type).toUpperCase())
            ));

            var instructions = exercise.instructions;
            if (instructions === undefined) {
                instructions = exercise.instruction;
            }

            var heading = element(
                "h2",
                null,
                text(instructions).trim() || typeLabel(text(exercise.type).toUpperCase())
            );
            heading.id = headingId;
            card.appendChild(heading);

            if (text(exercise.prompt).length > 0) {
                var prompt = element("p", "prompt", exercise.prompt);
                card.appendChild(prompt);
            }

            var controller = answerController(exercise, exerciseIndex);
            card.appendChild(controller.node);

            var actions = element("div", "actions");
            var checkButton = element("button", "check-button", "Check answer");
            checkButton.type = "button";
            var resetButton = element("button", "reset-button", "Reset");
            resetButton.type = "button";
            actions.appendChild(checkButton);
            actions.appendChild(resetButton);
            card.appendChild(actions);

            var feedback = element("div", "feedback");
            feedback.setAttribute("role", "status");
            feedback.setAttribute("aria-live", "polite");
            card.appendChild(feedback);

            var explanation = element("div", "explanation");
            explanation.hidden = true;
            explanation.appendChild(element("strong", null, "Explanation"));
            explanation.appendChild(element("p", null, exercise.explanation));
            card.appendChild(explanation);

            if (controller.supported === false) {
                checkButton.disabled = true;
                resetButton.disabled = true;
            }

            function clearFeedback() {
                feedback.textContent = "";
                feedback.className = "feedback";
                explanation.hidden = true;
            }

            function checkAnswer() {
                if (checkButton.disabled) {
                    return;
                }
                if (!controller.hasAnswer()) {
                    feedback.textContent = "Choose or enter an answer first.";
                    feedback.className = "feedback incorrect";
                    explanation.hidden = true;
                    var focusTarget = controller.focusTarget();
                    if (focusTarget) {
                        focusTarget.focus();
                    }
                    return;
                }

                var correct = controller.isCorrect();
                completedExercises[exerciseIndex] = correct;
                feedback.textContent = correct
                    ? "Correct — nicely done."
                    : "Not quite. Reset or change your answer and try again.";
                feedback.className = correct ? "feedback correct" : "feedback incorrect";
                explanation.hidden = text(exercise.explanation).length === 0;
                card.classList.toggle("is-correct", correct);
                if (correct) {
                    controller.lock();
                    checkButton.disabled = true;
                }
                updateProgress();
                persistSessionState();
            }

            function resetAnswer() {
                controller.reset();
                completedExercises[exerciseIndex] = false;
                checkButton.disabled = controller.supported === false;
                card.classList.remove("is-correct");
                clearFeedback();
                updateProgress();
                persistSessionState();
                var focusTarget = controller.focusTarget();
                if (focusTarget) {
                    focusTarget.focus();
                }
            }

            controller.onChange(function () {
                if (!completedExercises[exerciseIndex]) {
                    clearFeedback();
                }
                persistSessionState();
            });
            if (controller.onSubmit) {
                controller.onSubmit(checkAnswer);
            }
            checkButton.addEventListener("click", checkAnswer);
            resetButton.addEventListener("click", resetAnswer);

            return {
                card: card,
                getState: controller.getState,
                reset: resetAnswer,
                restoreState: function (answerState, isComplete) {
                    controller.restoreState(answerState);
                    completedExercises[exerciseIndex] = isComplete === true;
                    card.classList.toggle("is-correct", isComplete === true);
                    clearFeedback();
                    if (isComplete === true) {
                        controller.lock();
                        checkButton.disabled = true;
                        feedback.textContent = "Correct — nicely done.";
                        feedback.className = "feedback correct";
                        explanation.hidden = text(exercise.explanation).length === 0;
                    } else {
                        checkButton.disabled = controller.supported === false;
                    }
                }
            };
        }

        function showEmpty(title, message) {
            clearElement(exerciseList);
            progressRow.hidden = true;
            completion.hidden = true;
            emptyTitle.textContent = title;
            emptyMessage.textContent = message;
            emptyState.hidden = false;
        }

        function renderParsedSession(session) {
            var exercises = Array.isArray(session) ? session : array(session.exercises);
            var title = !Array.isArray(session) ? text(session.title).trim() : "";

            sessionTitle.textContent = title || "Your exercises";
            clearElement(exerciseList);
            emptyState.hidden = true;
            completion.hidden = true;
            completedExercises = new Array(exercises.length).fill(false);
            renderedControllers = [];

            if (exercises.length === 0) {
                showEmpty("No exercises were generated", "Generate a new session and try again.");
                return;
            }

            exercises.forEach(function (rawExercise, exerciseIndex) {
                var exercise = rawExercise && typeof rawExercise === "object" ? rawExercise : {};
                var rendered = renderExercise(exercise, exerciseIndex, exercises.length);
                renderedControllers.push(rendered);
                exerciseList.appendChild(rendered.card);
            });

            progressRow.hidden = false;
            updateProgress();
            window.scrollTo({ top: 0, behavior: "auto" });
        }

        reviewButton.addEventListener("click", function () {
            var firstCard = exerciseList.firstElementChild;
            if (firstCard) {
                firstCard.scrollIntoView({ behavior: "smooth", block: "start" });
                firstCard.setAttribute("tabindex", "-1");
                firstCard.focus({ preventScroll: true });
            }
        });

        window.renderSession = function (base64Payload) {
            try {
                var json = decodeBase64Utf8(text(base64Payload));
                var parsed = JSON.parse(json);
                if (!parsed || (typeof parsed !== "object" && !Array.isArray(parsed))) {
                    throw new Error("Invalid session");
                }
                renderParsedSession(parsed);
            } catch (error) {
                sessionTitle.textContent = "Exercise session unavailable";
                showEmpty("Unable to open this session", "The generated exercises could not be read. Please generate a new session.");
            }
        };

        window.restoreSessionState = function (base64Payload) {
            try {
                var state = JSON.parse(decodeBase64Utf8(text(base64Payload)));
                var answers = array(state.answers);
                var completed = array(state.completed);
                if (state.version !== 1 ||
                    answers.length !== renderedControllers.length ||
                    completed.length !== renderedControllers.length) {
                    return;
                }
                renderedControllers.forEach(function (controller, index) {
                    controller.restoreState(answers[index], completed[index] === true);
                });
                updateProgress(false);
            } catch (error) {
                // Ignore malformed or stale state and keep the freshly rendered session.
            }
        };
    }());
</script>
</body>
</html>
